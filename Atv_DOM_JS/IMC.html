<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMC</title>
</head>
<body>
    <form id="IMC">
        <input type="text" id="peso" placeholder="Peso">
        <input type="text" id="altura" placeholder="Altura">
        <button type="submit">Calcular</button>
    </form>
    <h1 id="resultado"></h1>
    <script>
        const form = document.getElementById('IMC');
        const resultado = document.getElementById('resultado');

        form.addEventListener('submit', (event) => {
            event.preventDefault();

            const peso = parseFloat(document.getElementById('peso').value);
            const altura = parseFloat(document.getElementById('altura').value);
            const imc = peso / (altura * altura);

            resultado.textContent = `Seu IMC é: ${imc.toFixed(2)}`;

            if (imc < 18.5) {
                resultado.textContent += ' (Abaixo do peso)';
            } else if (imc < 25) {
                resultado.textContent += ' (Peso normal)';
            } else if (imc < 30) {
                resultado.textContent += ' (Sobrepeso)';
            } else {
                resultado.textContent += ' (Obesidade)';
            }
        });
    </script>
</body>
</html>
